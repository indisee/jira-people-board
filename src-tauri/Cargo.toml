[package]
name = "jira-people-board"
version = "0.1.0"
description = "Jira People Board"
edition = "2021"
license = "MIT"

[lib]
name = "jira_people_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
percent-encoding = "2"
base64 = "0.22"
tokio = { version = "1", features = ["process", "time", "io-util", "fs", "macros", "sync"] }
