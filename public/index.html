<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jira People Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/brief.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="htitle">
      <h1>Jira People Board</h1>
      <textarea class="memo" id="memo" rows="1" aria-label="Notes" placeholder="Notes — Enter adds a bullet, Shift+Enter a plain line"></textarea>
    </div>
    <div class="tools">
      <label class="toggle" for="donePeriod">Done tickets <select id="donePeriod"><option value="0">Hide</option><option value="7">Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option></select></label>
      <span class="stamp" id="stamp"></span>
      <span class="seg" role="group" aria-label="Fold people">
        <button class="btn icon" id="foldAll" type="button" title="Collapse all" aria-label="Collapse all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></svg></button><button class="btn icon" id="unfoldAll" type="button" title="Expand all" aria-label="Expand all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg></button>
      </span>
      <span class="bellwrap">
        <button class="btn icon bell" id="bell" type="button" aria-label="Changes" aria-haspopup="true" aria-expanded="false" title="What changed on the board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge" id="bellBadge" hidden></span></button>
        <div class="npanel" id="npanel" hidden></div>
      </span>
      <button class="btn icon" id="dailyBtn" type="button" title="Daily notes — everyone's Done / Doing for a day, ready to copy" aria-label="Daily notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="M8 14h8"/><path d="M8 18h5"/></svg></button>
      <button class="btn icon" id="briefBtn" type="button" title="Brief any ticket by key (Claude)" aria-label="Brief a ticket"></button>
      <button class="btn icon" id="refresh" type="button" title="Refresh (also runs every minute)" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </div>
  </header>
  <div id="banner" hidden></div>
  <div class="board">
    <table>
      <thead><tr><th class="c-person">Person</th><th><span class="throw"><span>Assigned tickets</span><span class="hcols"><span class="h-age" title="How long the ticket has been open · how long it has been on this person">Open · Owned</span><span class="h-sp" title="Story points">SP</span></span></span></th></tr></thead>
      <tbody id="rows">
        <tr class="emptyrow"><td colspan="2">Loading your list…</td></tr>
      </tbody>
    </table>
  </div>
</div>
<div id="modalRoot"></div>
</body>
</html>
